name: Test and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # Downloads the Pyodide runtime and refuses it unless every file matches
      # the SHA-256 hashes pinned in tools/fetch_pyodide.py.
      - run: uv run python tools/fetch_pyodide.py
      - run: uv run python tools/build_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    # Only from main, and only once the repository is public
    # (GitHub Pages on a private repository needs a paid plan).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
